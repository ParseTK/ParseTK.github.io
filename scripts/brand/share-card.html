<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <style>
            @font-face {
                font-family: "Space Grotesk";
                src: url("../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2")
                    format("woff2");
                font-weight: 300 700;
            }
            @font-face {
                font-family: "Inter";
                src: url("../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2")
                    format("woff2");
                font-weight: 100 900;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            html,
            body {
                width: 1200px;
                height: 630px;
                overflow: hidden;
            }
            body {
                position: relative;
                background: #05080f;
                color: #e1e7ef;
                font-family: "Inter", sans-serif;
            }
            .glow {
                position: absolute;
                width: 1000px;
                height: 1000px;
                border-radius: 50%;
                background: radial-gradient(
                    closest-side,
                    rgba(244, 123, 37, 0.3) 0%,
                    rgba(244, 123, 37, 0.24) 15%,
                    rgba(244, 123, 37, 0.16) 32%,
                    rgba(244, 123, 37, 0.09) 50%,
                    rgba(244, 123, 37, 0.04) 68%,
                    rgba(244, 123, 37, 0.01) 84%,
                    transparent 100%
                );
            }
            .glow.top {
                left: -420px;
                top: -480px;
            }
            .glow.bottom {
                right: -520px;
                bottom: -600px;
                opacity: 0.7;
            }
            svg.stars {
                position: absolute;
                inset: 0;
            }
            .frame {
                position: absolute;
                inset: 40px;
                border: 1px solid #1c2a40;
                border-radius: 3px;
            }
            .frame::before,
            .frame::after {
                content: "";
                position: absolute;
                width: 34px;
                height: 34px;
                border: 4px solid #f47b25;
            }
            .frame::before {
                left: -3px;
                top: -3px;
                border-right: 0;
                border-bottom: 0;
            }
            .frame::after {
                right: -3px;
                bottom: -3px;
                border-left: 0;
                border-top: 0;
            }
            .content {
                position: absolute;
                left: 104px;
                top: 0;
                bottom: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .mark {
                width: 112px;
                height: 112px;
                margin-bottom: 44px;
            }
            h1 {
                font-family: "Space Grotesk", sans-serif;
                font-weight: 700;
                font-size: 120px;
                line-height: 1;
                letter-spacing: -0.03em;
            }
            h1 span {
                color: #f47b25;
            }
            p.role {
                margin-top: 26px;
                font-size: 46px;
                font-weight: 500;
                color: #a9b5c6;
            }
            .url {
                position: absolute;
                left: 104px;
                bottom: 76px;
                font-size: 28px;
                color: #f47b25;
                letter-spacing: 0.02em;
            }
        </style>
    </head>
    <body>
        <div class="glow top"></div>
        <div class="glow bottom"></div>
        <svg class="stars" id="stars" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true"></svg>
        <div class="frame"></div>
        <div class="content">
            <img class="mark" src="../../public/favicon.svg" alt="" />
            <h1><span>Tyler</span> Kirchner</h1>
            <p class="role">Software Developer</p>
        </div>
        <div class="url">parsetk.github.io</div>
        <script>
            // A fixed pseudo-random sky, so every render looks the same
            let seed = 7;
            const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            const sky = document.getElementById("stars");
            for (let i = 0; i < 70; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute("cx", (random() * 1200).toFixed(1));
                circle.setAttribute("cy", (random() * 630).toFixed(1));
                circle.setAttribute("r", (0.6 + random() * 1.4).toFixed(2));
                circle.setAttribute("fill", "#ffffff");
                circle.setAttribute("opacity", (0.15 + random() * 0.6).toFixed(2));
                sky.appendChild(circle);
            }
        </script>
    </body>
</html>
